# YOLOv8 + DAAM + lightweight progressive AFPN
# This variant keeps DAAM as the semantic enhancer and replaces the standard
# PAN neck with a light progressive P3/P4/P5 fusion path. ASFF is intentionally
# omitted for the first ablation to avoid modality-specific fusion bias.

nc: 2
scales:
  n: [0.33, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]     # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]    # 7-P5/32
  - [-1, 3, DAAM, [1024]]          # 8
  - [-1, 1, SPPF, [1024, 5]]       # 9-P5/32

head:
  # Stage 1: adjacent P3/P4 fusion before introducing P5 semantics.
  - [4, 1, Conv, [256, 1, 1]]      # 10-P3 lateral
  - [6, 1, Conv, [256, 1, 1]]      # 11-P4 lateral
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[10, -1], 1, Concat, [1]]
  - [-1, 1, C2f, [256]]            # 14-P3/P4 fused

  - [-1, 1, DWConv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C2f, [512]]            # 17-P4 from adjacent P3/P4

  # Stage 2: progressively inject DAAM-enhanced P5 semantics.
  - [9, 1, Conv, [512, 1, 1]]      # 18-P5 lateral
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[17, -1], 1, Concat, [1]]
  - [-1, 1, C2f, [512]]            # 21-P4 with P5 semantics

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[14, -1, 10], 1, Concat, [1]]
  - [-1, 1, C2f, [256]]            # 24-P3 output

  # Light bottom-up refinement for final P4/P5 outputs.
  - [-1, 1, DWConv, [512, 3, 2]]
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 1, C2f, [512]]            # 27-P4 output

  - [-1, 1, DWConv, [1024, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, C2f, [1024]]           # 30-P5 output

  - [[24, 27, 30], 1, Detect, [nc]]
